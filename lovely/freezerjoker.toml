[manifest]
version = "1.0.0"
priority = 0

# Freezer joker check was at the top of calculate_joker, but
# has been moved since calculate_joker was called very, very often.
# Looks worse, but performs better probably.

# Popcorn freezer check
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
if self.ability.mult - self.ability.extra <= 0 then 
    SMODS.destroy_cards(self, nil, nil, true)
    return {
        message = localize('k_eaten_ex'),
        colour = G.C.RED
    }
else
    SMODS.scale_card(self, {
        ref_table = self.ability,
        ref_value = "mult",
        scalar_value = "extra",
        message_key = 'a_mult_minus',
        colour = G.C.MULT,
        operation = '-'
    })
    return nil, true
end
'''
position = 'at'
payload = '''
-- 12b code start

print("Freezer check")

local has_freezer = false
if G.jokers and G.jokers.cards then
    for _, card in ipairs(G.jokers.cards) do
        if card.config.center.key == "j_dozenb_freezer" then
            has_joker = true
            break
        end
    end
end 

-- 12b code end

if has_freezer == false then
    if self.ability.mult - self.ability.extra <= 0 then 
        SMODS.destroy_cards(self, nil, nil, true)
        return {
            message = localize('k_eaten_ex'),
            colour = G.C.RED
        }
    else
        SMODS.scale_card(self, {
            ref_table = self.ability,
            ref_value = "mult",
            scalar_value = "extra",
            message_key = 'a_mult_minus',
            colour = G.C.MULT,
            operation = '-'
        })
        return nil, true
    end
else
    return {
            message = 'Frozen!',
            colour = G.C.BLUE
        }
end
'''
match_indent = true




# Gros Michel + Cavendish freezer check
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
if SMODS.pseudorandom_probability(self, self.ability.name == 'Cavendish' and 'cavendish' or 'gros_michel', 1, self.ability.extra.odds) then 
    SMODS.destroy_cards(self, nil, nil, true)
    if self.ability.name == 'Gros Michel' then G.GAME.pool_flags.gros_michel_extinct = true end
    return {
        message = localize('k_extinct_ex')
