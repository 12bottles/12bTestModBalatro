# Bean freezer check
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
if self.ability.extra.h_size - self.ability.extra.h_mod <= 0 then 
    SMODS.destroy_cards(self, nil, nil, true)
    return {
        card = self,
        message = localize('k_eaten_ex'),
        colour = G.C.FILTER
    }
else
    SMODS.scale_card(self, {
        ref_table = self.ability.extra,
        ref_value = "h_size",
        scalar_value = "h_mod",
        message_key = 'a_handsize_minus',
        operation = function(ref_table, ref_value, initial, change)
            ref_table[ref_value] = initial - change
            G.hand:change_size(- change)
        end
    })
    return nil, true
    end
'''
position = 'at'
payload = '''
-- 12b code start

print("Freezer check")

local has_freezer = false
if G.jokers and G.jokers.cards then
    for _, card in ipairs(G.jokers.cards) do
        if card.config.center.key == "j_dozenb_freezer" then
            has_freezer = true
            break
        end
    end
end 

-- 12b code end

if has_freezer == false then
    if self.ability.extra.h_size - self.ability.extra.h_mod <= 0 then 
        SMODS.destroy_cards(self, nil, nil, true)
        return {
            card = self,
            message = localize('k_eaten_ex'),
            colour = G.C.FILTER
        }
    else
        SMODS.scale_card(self, {
            ref_table = self.ability.extra,
            ref_value = "h_size",
            scalar_value = "h_mod",
            message_key = 'a_handsize_minus',
            operation = function(ref_table, ref_value, initial, change)
                ref_table[ref_value] = initial - change
                G.hand:change_size(- change)
            end
        })
        return nil, true
    end
else
    return {
            message = 'Frozen!',
            colour = G.C.BLUE
        }
end
'''
match_indent = true








