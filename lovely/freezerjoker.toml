# Invisible Joker freezer check
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
self.ability.invis_rounds = self.ability.invis_rounds + 1
if self.ability.invis_rounds == self.ability.extra then 
    local eval = function(card) return not card.REMOVED end
    juice_card_until(self, eval, true)
end
return {
    message = (self.ability.invis_rounds < self.ability.extra) and (self.ability.invis_rounds..'/'..self.ability.extra) or localize('k_active_ex'),
    colour = G.C.FILTER
}
'''
position = 'at'
payload = '''
-- 12b code start

print("Freezer check")

local has_freezer = false
if G.jokers and G.jokers.cards then
    for _, card in ipairs(G.jokers.cards) do
        if card.config.center.key == "j_dozenb_freezer" then
            has_freezer = true
            break
        end
    end
end 

-- 12b code end

if has_freezer == false then
    self.ability.invis_rounds = self.ability.invis_rounds + 1
    if self.ability.invis_rounds == self.ability.extra then 
        local eval = function(card) return not card.REMOVED end
        juice_card_until(self, eval, true)
    end
    return {
        message = (self.ability.invis_rounds < self.ability.extra) and (self.ability.invis_rounds..'/'..self.ability.extra) or localize('k_active_ex'),
        colour = G.C.FILTER
    }
else
    return {
            message = 'Frozen!',
            colour = G.C.BLUE
        }
end
'''
match_indent = true




